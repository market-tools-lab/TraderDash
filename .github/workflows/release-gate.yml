name: release-gate

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - "feature/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application modules
        run: python -m compileall -q app.py supabase_auth.py accounts.py account_store.py account_privacy.py stripe_test.py access.py plans.py universes.py
      - name: Run the test suite
        run: python -m unittest discover -s tests
